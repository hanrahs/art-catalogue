<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <title>Art Catalogue</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="v-mine" class="view"></section>
    <section id="v-liked" class="view" hidden></section>
    <section id="v-artists" class="view" hidden></section>
    <section id="v-more" class="view" hidden></section>
  </main>

  <nav id="tabs">
    <button data-tab="mine" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3zM5 6v12h14V6zm2 10 3-4 2 2.5 3-4.5 3 6z"/></svg>Collection</button>
    <button data-tab="liked"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 10.6 19.7C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1C19.6 2.6 22 5 22 8.1c0 3.8-3.4 6.9-8.6 11.6z"/></svg>Liked</button>
    <button data-tab="artists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-9 2-9 5.5V21h18v-1.5C21 16 16 14 12 14z"/></svg>Artists</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 10A7.5 7.5 0 0 0 5.4 8 6 6 0 0 0 6 20h13a5 5 0 0 0 .4-10zM14 13v4h-4v-4H7l5-5 5 5z"/></svg>Backup</button>
  </nav>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
